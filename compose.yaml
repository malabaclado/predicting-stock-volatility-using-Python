version: '3.8'

services:
  # Container 1: The FastAPI API
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./market_data.sqlite:/app/market_data.sqlite
      - ./models.sqlite:/app/models.sqlite
      - ./models:/app/models
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    restart: always

